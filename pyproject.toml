[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlplane-ai-gateway"
version = "0.1.0"
description = "Enterprise AI Proxy Gateway with five-stage safety pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "llm-guard",
    "routellm>=0.2.0",
    "portkey-ai>=1.7.0",
    "faiss-cpu>=1.9.0",
    "spacy>=3.8.0",
    "tiktoken>=0.7.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "openai>=1.30.1",
    "python-multipart>=0.0.9",
    "langfuse",
    "guardrails-ai",
    "pyrit",
    "garak",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-timeout>=2.3.1",
    "hypothesis>=6.100.2",
    "anyio>=4.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]
timeout = 60

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
